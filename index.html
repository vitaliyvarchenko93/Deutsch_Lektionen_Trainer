<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lektionen Trainer — Выбор уровня</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .selector-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #f1f5f9;
      text-align: center;
      word-break: break-word;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }
    .option-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 18px;
      padding: 32px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .option-card:hover, .option-card:active {
      border-color: #38bdf8;
      background: #243248;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -5px rgba(56, 189, 248, 0.3);
    }
    .option-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .option-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* Модальное окно «В разработке» */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 32px 24px;
      width: 85%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
    }
    .modal-text {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .modal-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="selector-container">
    <h1 class="title">Выбор уровня тренажера</h1>
    
    <div class="grid">
      <!-- Кнопка A1 -->
      <a class="option-card" href="Lektionen Trainer A1.html">
        <div class="option-title">A1</div>
        <div class="option-subtitle">Lektionen Trainer A1</div>
      </a>
      
      <!-- Кнопка A2 -->
      <a class="option-card" href="Lektionen Trainer A2.html">
        <div class="option-title">A2</div>
        <div class="option-subtitle">Lektionen Trainer A2</div>
      </a>
      
      <!-- Кнопка B1 -->
      <a class="option-card" href="Lektionen Trainer B1.html">
        <div class="option-title">B1</div>
        <div class="option-subtitle">Lektionen Trainer B1</div>
      </a>
      
      <!-- Кнопка B2 -->
      <div class="option-card" id="btn-b2">
        <div class="option-title">B2</div>
        <div class="option-subtitle">Lektionen Trainer B2</div>
      </div>
    </div>
  </div>

  <!-- Всплывающее окно -->
  <div class="modal-overlay" id="dev-modal">
    <div class="modal-card">
      <div class="modal-title">Страница в разработке</div>
      <div class="modal-text">Данный раздел находится в процессе разработки.</div>
      <button class="modal-btn" onclick="closeModal()">Понятно</button>
    </div>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  const btnB2 = document.getElementById('btn-b2');
  const modal = document.getElementById('dev-modal');

  btnB2.addEventListener('click', () => {
    modal.classList.add('active');
  });

  function closeModal() {
    modal.classList.remove('active');
  }

  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });
</script>
</body>
</html>
